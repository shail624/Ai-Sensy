# Production topology (Doc 08 §6/§10/§11; Doc 06 §2.3 queue pools).
#
# Ten services: mysql, redis, migrate (one-shot), api, three worker pools, beat, frontend, nginx.
#
# Two properties this file exists to guarantee:
#   1. **Schema before traffic.** `migrate` runs to completion and exits; api/worker/beat all wait
#      on `service_completed_successfully`, so no replica ever serves an older schema.
#   2. **Pool isolation.** Workers are split by queue exactly as the registry defines, so a bulk
#      campaign send cannot starve control traffic, webhooks, or the analytics rollup.
#
# Secrets come from the environment (an `.env` file next to this one, or the orchestrator's secret
# store). Nothing here has a production default.
#
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d

name: wa-platform

# Every container writes JSON logs to stdout, and Docker's default json-file driver keeps them
# **forever**. On a busy stack that fills the host disk, which takes MySQL down with it. Capping
# the ring here is the difference between "logs rotate" and "the server stops accepting writes at
# 3am". Ship to a real aggregator in front of this if you have one (Doc 08 §19).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-image: &backend-image
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: wa-platform/backend:${IMAGE_TAG:?IMAGE_TAG is required}

x-backend-env: &backend-env
  ENVIRONMENT: production
  DEBUG: "false"
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  # Encrypts WABA access tokens at rest (Doc 03 §5.1, FR-WA-03). Required, not optional: in
  # production `app.core.crypto` refuses to derive a key from SECRET_KEY, so without this every
  # encrypt/decrypt raises and the WhatsApp integration is inert — no WABA can be registered and
  # no stored token can be read back, which surfaces as a 500 on onboarding rather than as a
  # configuration error. Rotating it makes existing stored tokens undecryptable; re-enter them.
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY is required}
  DATABASE_URL: mysql+aiomysql://${DB_USER:?}:${DB_PASSWORD:?}@mysql:3306/${DB_NAME:?}?charset=utf8mb4
  DB_HOST: mysql
  DB_PORT: "3306"
  # Redis carries the broker, the cache, the rate gate and the idempotency store. It is
  # password-protected even though no port is published: an unauthenticated Redis is a remote
  # code execution primitive the moment anything else on the host can reach the bridge network.
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: "true"
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  STORAGE_LOCAL_PATH: /var/lib/wa/media
  STORAGE_EXPORT_TTL_DAYS: ${STORAGE_EXPORT_TTL_DAYS:-7}
  META_APP_SECRET: ${META_APP_SECRET:?META_APP_SECRET is required}
  META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:?META_WEBHOOK_VERIFY_TOKEN is required}
  # ---- QR provider (ADR-0021 Class B), optional ----------------------------------------------
  # All four are empty by default, and the adapter treats "unconfigured" as disabled: with these
  # unset the QR surface reports `configured=false` to every caller and registers no runtime, so
  # the stack behaves exactly as it did before the provider existed. Set them only alongside
  # `--profile waha`. The service address is the compose network name — never a public URL.
  WAHA_BASE_URL: ${WAHA_BASE_URL:-}
  WAHA_API_KEY: ${WAHA_API_KEY:-}
  WAHA_SESSION_NAME: ${WAHA_SESSION_NAME:-}
  # Signs inbound provider deliveries (raw-body SHA-512 HMAC, verified before parsing). Empty
  # rejects every delivery rather than accepting unsigned ones — fail closed, never open.
  WAHA_WEBHOOK_HMAC_SECRET: ${WAHA_WEBHOOK_HMAC_SECRET:-}
  # The single organization the QR surface belongs to (ADR-0021: internal, self-hosted, one
  # organization — not multi-tenant SaaS). Every other organization sees `configured=false`.
  WAHA_ORGANIZATION_ID: ${WAHA_ORGANIZATION_ID:-}

x-backend-common: &backend-common
  <<: *backend-image
  restart: unless-stopped
  logging: *default-logging
  volumes:
    # Exports and inbound media are written here; every backend role must see the same volume or
    # a worker writes an artifact the API cannot serve.
    - media-data:/var/lib/wa/media
  depends_on:
    migrate:
      condition: service_completed_successfully

# Celery's warm shutdown lets a worker finish the task in its hand before exiting. Docker's default
# grace period is 10s, after which it sends SIGKILL — long enough to interrupt a send mid-flight and
# leave it to be redelivered. `task_acks_late` makes that safe, but redelivery is still duplicated
# work; giving the pool a real window avoids it.
x-worker-common: &worker-common
  <<: *backend-common
  command: ["worker"]
  stop_grace_period: 60s

services:
  # ---- Stateful dependencies ---------------------------------------------------------------
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-authentication-plugin=caching_sha2_password
      --max-connections=${MYSQL_MAX_CONNECTIONS:-300}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    logging: *default-logging
    # AOF on: Redis carries the broker queue, so losing it loses queued work (Doc 06 §12.6
    # calls Redis rebuildable, but in-flight tasks are not).
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      # `-a` must match --requirepass or every probe returns NOAUTH and the stack never starts.
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- QR provider (ADR-0021 Class B; optional, opt-in) --------------------------------------
  #
  # In the `waha` profile, so an operator who has not adopted the QR channel runs the exact stack
  # they run today. Bring it up deliberately:
  #
  #     docker compose -f docker-compose.production.yml --env-file .env.production \
  #       --profile waha up -d
  #
  # **Never published.** There is no `ports:` block, by design: WAHA's API is an unauthenticated
  # WhatsApp bridge unless an API key is set, and even with one it must not be internet-reachable.
  # Only the backend talks to it, over the compose network at `http://waha:3000`. Nginx does not
  # proxy it, and no route to it exists from outside the bridge.
  #
  # Pinned by digest, not tag: the provider certification evidence
  # (`docs/evidence/provider-evaluations/`) is for one immutable build, and a floating tag could be
  # repointed upstream without notice — silently invalidating it.
  waha:
    image: devlikeapro/waha@sha256:33ecd1b782b2708db2ff1d366f51608889a036e76332dceae3fbbe3f10f2d75e
    profiles: ["waha"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      # NOWEB is the certified engine. The adapter fails closed on any other
      # (`WahaEngineNotApproved`), so this is pinned rather than left to an image default.
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY is required when the waha profile is enabled}
      WHATSAPP_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY is required when the waha profile is enabled}
    volumes:
      # WhatsApp session state — `/app/.sessions/noweb/waha.sqlite3` (session registry) and
      # `/app/.sessions/noweb/<session>/` (per-session store/config), verified against this exact
      # digest. This volume is what makes a restart survivable: without it the provider comes back
      # holding no session, answers `404 Session not found` for a connection the platform still
      # records as paired, and the operator must re-scan (QR-09-D2). Treat it as stateful data:
      # back it up with the database, and never prune it to "clean up disk".
      - waha-sessions:/app/.sessions
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- Schema (one-shot, must finish before anything serves) --------------------------------
  migrate:
    <<: *backend-image
    restart: "no"
    logging: *default-logging
    command: ["migrate"]
    environment: *backend-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- API ------------------------------------------------------------------------------------
  api:
    <<: *backend-common
    command: ["api"]
    environment:
      <<: *backend-env
      API_WORKERS: ${API_WORKERS:-2}
    expose:
      - "8000"
    # Let in-flight requests drain before SIGKILL; uvicorn stops accepting on SIGTERM.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ---- Workers, split by queue pool (Doc 06 §2.3) ----------------------------------------------
  # Realtime: control, priority sends, webhooks. Low concurrency, must stay responsive.
  worker-realtime:
    <<: *worker-common
    environment:
      <<: *backend-env
      WORKER_NAME: realtime
      WORKER_QUEUES: campaigns.control,scheduler.tick,sends.priority,webhooks.ingest,webhooks.process,inbound.process
      WORKER_CONCURRENCY: ${WORKER_REALTIME_CONCURRENCY:-4}
    healthcheck:
      # Round-trips the broker's control queue: proves this worker is consuming, not merely running.
      # Diagnostic only — nothing depends_on a worker, so a flapping probe cannot block a deploy.
      test: ["CMD-SHELL", "celery -A app.queue.celery_app.celery_app inspect ping -d realtime@$$(hostname) --timeout 10 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 15s
      start_period: 45s
      retries: 3

  # Bulk: campaign fan-out and retries. Scale this one for throughput; the rate gate paces sends.
  worker-bulk:
    <<: *worker-common
    environment:
      <<: *backend-env
      WORKER_NAME: bulk
      WORKER_QUEUES: sends.bulk,sends.retry
      WORKER_CONCURRENCY: ${WORKER_BULK_CONCURRENCY:-8}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.queue.celery_app.celery_app inspect ping -d bulk@$$(hostname) --timeout 10 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 15s
      start_period: 45s
      retries: 3

  # Jobs & maintenance: imports, exports, media, analytics rollups, cleanup. Long-running and
  # I/O heavy — isolated so a 1M-row export cannot delay a customer's reply.
  worker-jobs:
    <<: *worker-common
    environment:
      <<: *backend-env
      WORKER_NAME: jobs
      WORKER_QUEUES: imports,exports,media,default,templates.sync,analytics.rollup,notifications,cleanup,maintenance,ai,automation.run
      WORKER_CONCURRENCY: ${WORKER_JOBS_CONCURRENCY:-4}
    # An export or import can run for minutes; give it room to land before SIGKILL.
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.queue.celery_app.celery_app inspect ping -d jobs@$$(hostname) --timeout 10 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 15s
      start_period: 45s
      retries: 3

  # ---- Beat — exactly one replica ---------------------------------------------------------------
  # Two beats would fire every schedule twice. The tasks are idempotent so that is survivable,
  # but it doubles work for nothing. Never scale this service.
  beat:
    <<: *backend-common
    command: ["beat"]
    environment:
      <<: *backend-env
      BEAT_SCHEDULE_FILE: /var/run/celery/celerybeat-schedule
    volumes:
      - media-data:/var/lib/wa/media
      # Persisted so a restart does not re-fire a slot Beat has already sent.
      - beat-data:/var/run/celery
    deploy:
      replicas: 1
    healthcheck:
      # Beat has no control queue to inspect. Asserting the schedule file exists catches the
      # failure that actually happens: an unwritable volume, where beat exits before it can tick.
      test: ["CMD-SHELL", "test -f /var/run/celery/celerybeat-schedule || test -f /var/run/celery/celerybeat-schedule.db"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ---- Frontend (static SPA) ---------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = same-origin; the edge proxy serves the API under /api on this origin.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: wa-platform/frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "8080"

  # ---- Edge reverse proxy --------------------------------------------------------------------------
  nginx:
    image: nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      # The image carries its own HEALTHCHECK, so gate on it rather than on "the process started".
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql-data:
  redis-data:
  media-data:
  beat-data:
  waha-sessions:
