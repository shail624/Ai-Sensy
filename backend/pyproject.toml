[project]
name = "wa-platform-backend"
version = "0.1.0"
description = "Self-Hosted WhatsApp Business Platform — Backend (Vi Reactivation Team)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }

# Runtime dependencies. Versions target Python 3.13 (production image) and remain
# compatible with 3.14 so the test suite can run on a developer machine.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13",
    "asyncmy>=0.2.9",            # async MySQL driver (production)
    "aiosqlite>=0.20",           # async SQLite driver (tests / local)
    "redis>=5.0",
    "celery>=5.4",
    "argon2-cffi>=23.1",         # Argon2id password hashing (Doc 1 §5.4)
    "pyjwt>=2.9",                # JWT access/refresh tokens (Doc 4 §4)
    "httpx>=0.27",               # Meta Cloud API client (later modules) + test client
    "python-multipart>=0.0.12",  # multipart/form uploads
    "email-validator>=2.2",      # Pydantic EmailStr validation
    "openpyxl>=3.1",             # .xlsx import/export (FR-CON-04/15)
    "cryptography>=43",          # AES-GCM at-rest encryption for channel tokens (FR-WA-03)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Tooling configuration (single source, per Doc 12 §60 naming + Doc 1 §2.6)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["app"]
