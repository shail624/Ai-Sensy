[project]
name = "wa-platform-backend"
# PEP 440 spelling of the v1.0.0-rc1 tag (`-rc1` normalises to `rc1`); the runtime and the SPA
# use the semver spelling `1.0.0-rc1`.
version = "1.0.0rc1"
description = "Self-Hosted WhatsApp Business Platform — Backend (Vi Reactivation Team)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }

# Runtime dependencies. Versions target Python 3.13 (production image) and remain
# compatible with 3.14 so the test suite can run on a developer machine.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13",
    # asyncmy <=0.2.11 has an unpatched critical SQL-injection advisory
    # (GHSA-qhqw-rrw9-25rm). Keep the replacement and its escaping layer pinned.
    "aiomysql==0.3.2",           # async MySQL driver (production)
    "PyMySQL==1.2.0",
    "aiosqlite>=0.20",           # async SQLite driver (tests / local)
    "redis>=5.0",
    "celery>=5.4",
    "argon2-cffi>=23.1",         # Argon2id password hashing (Doc 1 §5.4)
    "pyjwt>=2.9",                # JWT access/refresh tokens (Doc 4 §4)
    "httpx>=0.27",               # Meta Cloud API client (later modules) + test client
    "python-multipart>=0.0.12",  # multipart/form uploads
    "email-validator>=2.2",      # Pydantic EmailStr validation
    "openpyxl>=3.1",             # .xlsx import/export (FR-CON-04/15)
    # AES-GCM at-rest encryption for channel tokens (FR-WA-03). Floor raised from >=43 to >=50:
    # PYSEC-2026-3552 affects 49.0.0 and is fixed in 50.0.0. This repository ships no lock file,
    # so the declared floor is the only thing that can stop a constrained or offline resolve from
    # selecting a vulnerable build (QR-09-S1).
    "cryptography>=50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # Pin the blocking type gate so local and automated runs interpret annotations identically.
    "mypy==2.3.0",
    # Security gates are pinned so their rule/output changes are explicit review events.
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Tooling configuration (single source, per Doc 12 §60 naming + Doc 1 §2.6)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["app"]
