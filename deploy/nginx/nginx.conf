# Edge reverse proxy (Doc 08 §6/§26).
#
# One entry point: the SPA on `/`, the API on `/api`, and the probes passed through unchanged so
# an orchestrator can health-gate the edge exactly as it would the API. TLS terminates here in a
# real deployment — see deploy/DEPLOYMENT.md §6 for the certificate block to add.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # Accept only bounded opaque correlation ids. Anything resembling an email, phone number,
    # bearer/JWT token, or arbitrary user text is replaced before it reaches either log stream.
    map $http_x_request_id $correlation_id {
        "~^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$" $http_x_request_id;
        default $request_id;
    }
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # `Connection: upgrade` only when the client actually asked to upgrade; otherwise keep-alive.
    # Declared before use for readability — nginx itself resolves maps regardless of order.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Structured-ish access log carrying the upstream timing and the request id the API echoes,
    # so an edge log line can be joined to an application log line.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time rid=$correlation_id';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;          # do not advertise the nginx version

    # ---- Compression -------------------------------------------------------------------------
    # Measured on the current build: app 496 kB → 119 kB, framework 208 kB → 68 kB, the lazy
    # analytics chunk 429 kB → 123 kB. Compression is worth roughly 4x on this payload, so it is
    # the single highest-value line in this file.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/problem+json application/xml
                      image/svg+xml font/woff font/woff2;

    # ---- Upload / request size ----------------------------------------------------------------
    # Bounded by the largest legitimate upload: a contact import or a WhatsApp media file
    # (Doc 08 §14). Anything larger is rejected at the edge rather than buffered into the API.
    client_max_body_size      25m;
    client_body_buffer_size   256k;
    client_header_timeout     30s;
    client_body_timeout       60s;

    # ---- Upstream resolution ---------------------------------------------------------------
    # Docker's embedded DNS. Load-bearing: nginx resolves a statically-named `upstream` server
    # **once, at config load**, and caches that address for the life of the process. Every
    # `docker compose up -d` gives the recreated api/frontend container a new IP, so the edge
    # kept proxying to the dead address and returned 502 for everything until nginx itself was
    # restarted — which would black-hole traffic on every deploy the upgrade procedure describes.
    # Reproduced here: nginx held 172.19.0.7 while the api had moved to 172.19.0.6.
    #
    # Putting the address in a variable defers resolution to request time, so a recreated
    # container is picked up within `valid=`. The cost is the loss of the upstream keepalive
    # pool — open-source nginx cannot have both (the `resolve` parameter on an upstream server is
    # NGINX Plus only). A new connection per proxied request is a fair price for surviving a
    # routine redeploy; the alternative is an outage that looks like the application is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name _;

        # ---- Security headers ------------------------------------------------------------------
        # `always` so they are attached to error responses too, not just 2xx.
        add_header X-Content-Type-Options    "nosniff"        always;
        add_header X-Frame-Options           "DENY"           always;
        # Matches the value the API's own SecurityHeadersMiddleware sets. They must agree: a
        # Referrer-Policy header carrying two different tokens resolves to whichever the browser
        # parses last, which is a coin toss rather than a policy.
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin"   always;
        # CSP: the SPA is same-origin and self-contained; `connect-src` covers the API on the same
        # origin. Loosen deliberately if a CDN or third-party analytics is ever introduced.
        # Kept on one line on purpose — a quoted nginx value broken across lines with a trailing
        # backslash embeds a literal newline in the header rather than continuing it.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        # HSTS is commented out until TLS terminates here — sending it over plain HTTP would
        # lock clients out of a site that cannot yet serve HTTPS.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ---- Probes (passthrough, unauthenticated) ---------------------------------------------
        # Same paths the API exposes, so orchestration health-gates the edge and the API alike.
        #
        # These proxy to the API just as /api/ does, so they need the same `proxy_hide_header` set.
        # Without it each probe response carried two copies of every security header — the API's
        # and this server's — and leaked the API's HSTS over plain HTTP, which the commented-out
        # directive above deliberately avoids. Measured against the running stack, not assumed.
        location = /health {
            set $api_backend api:8000;
            proxy_pass http://$api_backend/health;
            access_log off;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Cross-Origin-Opener-Policy;
            proxy_hide_header Strict-Transport-Security;
        }
        location = /ready {
            set $api_backend api:8000;
            proxy_pass http://$api_backend/ready;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Cross-Origin-Opener-Policy;
            proxy_hide_header Strict-Transport-Security;
        }

        # ---- API --------------------------------------------------------------------------------
        location /api/ {
            set $api_backend api:8000;
            proxy_pass http://$api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            # **Replace**, never append. uvicorn runs with --forwarded-allow-ips '*' and trusts
            # this header to populate `request.client`, which the auth rate limiter buckets on
            # (app/core/rate_limit.py). With `$proxy_add_x_forwarded_for` a client can send its
            # own X-Forwarded-For and rotate the value on every request, giving each attempt a
            # fresh bucket and defeating login brute-force protection entirely. This proxy is the
            # trust boundary, so the peer address is the only value worth forwarding.
            # Behind a load balancer, delete this line and instead set `set_real_ip_from <lb-cidr>;`
            # plus `real_ip_header X-Forwarded-For;` so $remote_addr is the true client — see
            # deploy/DEPLOYMENT.md §6.
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Preserve the client's request id so the API's structured logs correlate end to end.
            proxy_set_header X-Request-ID      $correlation_id;

            # Upgrade headers are set unconditionally: the platform has no WebSocket today (the
            # inbox polls), so this costs nothing and means adding one needs no proxy change.
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # The API sets these itself (SecurityHeadersMiddleware). nginx's add_header *appends*
            # to what the upstream returned, so without hiding them each response would carry two
            # copies. Hide the upstream's, and the server-level add_header above supplies exactly
            # one — keeping a single source of truth for what the browser actually receives.
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Cross-Origin-Opener-Policy;
            # The API also emits HSTS whenever ENVIRONMENT=production, which it is here. Hidden
            # for the same reason: this proxy owns transport policy, because it is the hop that
            # knows whether TLS actually terminated. Uncomment the header above when it does, and
            # the whole origin — SPA and API alike — starts sending exactly one consistent value.
            proxy_hide_header Strict-Transport-Security;

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            # Long enough for a synchronous list/report read, short enough to shed a hung upstream.
            # Genuinely long work (imports, exports, campaigns) is already async via the queue.
            proxy_read_timeout    60s;

            proxy_buffering on;
            proxy_redirect  off;
        }

        # ---- SPA ---------------------------------------------------------------------------------
        location / {
            set $frontend_backend frontend:8080;
            proxy_pass http://$frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }
}
