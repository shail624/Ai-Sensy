# SPA server (runs inside the frontend container).
#
# Static serving only: compression, security headers and API proxying belong to the edge proxy so
# they exist in exactly one place. This server's whole job is "return the right file, and fall back
# to index.html so client-side routes deep-link".

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Source maps are built (`sourcemap: "hidden"` in vite.config.ts) so a release can still be
    # symbolicated from the image or uploaded to an error tracker — but they are never served.
    # A map is the application's full source: every internal route, API shape and comment.
    # Regex locations are evaluated before prefix locations, so this wins over /assets/ below.
    location ~* \.map$ {
        access_log off;
        return 404;
    }

    # Vite emits content-hashed filenames, so an asset URL is immutable — cache it hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients pinned to old asset hashes.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Container healthcheck target — cheap, no filesystem access.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # History fallback: /tasks, /analytics, /contacts/:id are client routes, not files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
