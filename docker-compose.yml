# Local development infrastructure (Doc 08 §6/§10/§11).
# Provides the stateful dependencies (MySQL 8, Redis 7) the backend needs to run
# locally. In development the backend (uvicorn) and frontend (vite) run on the host;
# full app containerization + Nginx is delivered in the deployment step.

services:
  mysql:
    image: mysql:8.0
    container_name: wa_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-wa_platform}
      MYSQL_USER: ${DB_USER:-wa_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wa_app}
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-authentication-plugin=caching_sha2_password
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wa_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # WAHA — the Class B QR/WhatsApp provider (ADR-0021; Design Document 33 §6.4).
  #
  # Opt-in for local development: it is in the `waha` profile, so a plain `docker compose up -d`
  # still starts only MySQL and Redis exactly as before. Start it deliberately with:
  #
  #     docker compose --profile waha up -d
  #
  # Pinned by digest, never by tag. The certification evidence in
  # `docs/evidence/provider-evaluations/` is for one immutable build; a floating `:noweb-2026.7.2`
  # could be repointed upstream at any time and would silently invalidate it.
  waha:
    image: devlikeapro/waha@sha256:33ecd1b782b2708db2ff1d366f51608889a036e76332dceae3fbbe3f10f2d75e
    container_name: wa_waha
    profiles: ["waha"]
    restart: unless-stopped
    environment:
      # NOWEB is the only engine this adapter is certified against — the adapter fails closed on
      # any other (`WahaEngineNotApproved`), so pinning it here keeps dev matching production.
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY:-waha-local-dev-key}
      WHATSAPP_API_KEY: ${WAHA_API_KEY:-waha-local-dev-key}
    # Bound to the loopback interface on purpose: the QR screen is driven by the backend running on
    # the host, so the port has to be reachable locally — but binding 0.0.0.0 would expose an
    # unauthenticated-by-default WhatsApp bridge to the whole network. Production publishes nothing
    # at all (see docker-compose.production.yml).
    ports:
      - "127.0.0.1:${WAHA_PORT:-3000}:3000"
    volumes:
      # Session state lives here — verified empirically against this exact digest:
      # `/app/.sessions/noweb/waha.sqlite3` (the session registry) plus
      # `/app/.sessions/noweb/<session>/` (per-session store and config). Without this volume a
      # container restart loses every session, and the provider then answers
      # `404 Session not found` for a connection the platform still believes is paired — the exact
      # condition recorded as QR-09-D2.
      - waha-sessions:/app/.sessions
    healthcheck:
      # The certified image contains curl but not wget. `/health` is API-key protected; `/ping` is
      # the provider-owned, unauthenticated process/API liveness endpoint and deliberately says
      # nothing about whether a WhatsApp account is paired (QR-06 provider-health semantics).
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:3000/ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
  redis-data:
  waha-sessions:
