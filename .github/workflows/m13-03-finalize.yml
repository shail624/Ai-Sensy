name: M13-03 validated finalization

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation authority
        uses: actions/checkout@v4
        with:
          ref: validation/m13-03-builder
          path: builder
          clean: false
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ui/taste-modernization
          fetch-depth: 0
          path: work
          clean: false
      - name: Reproduce validated M13-03 tree
        run: |
          test "$(git -C work rev-parse HEAD)" = "283ebe83b53a510ce671f150bfe14fe38a5292f6"
          test -z "$(git -C work status --porcelain)"
          cat builder/.github/m13-03-patch/part* > /tmp/m13-03.patch.gz.b64
          test "$(sha256sum /tmp/m13-03.patch.gz.b64 | cut -d' ' -f1)" = "4ab5a723e7f5127c77a60e39636f6de96cfe10e9945cee87b011d9481facdbe9"
          base64 --decode /tmp/m13-03.patch.gz.b64 | gzip --decompress > /tmp/m13-03.patch
          test "$(wc -c < /tmp/m13-03.patch)" = "84921"
          git -C work apply --index /tmp/m13-03.patch
          python builder/.github/m13-03-fixes.py work
          git -C work add -A
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: work/backend/pyproject.toml
      - name: Install and format exact Python files
        run: |
          python -m pip install -e './work/backend[dev]'
          cd work/backend
          ruff format \
            app/channels/secrets.py \
            app/models/channel_connection.py \
            app/repositories/channel_connection.py \
            app/services/channel_connection_service.py \
            app/services/audit_service.py \
            app/models/__init__.py \
            alembic/versions/0037_persistent_channel_connections.py \
            tests/test_channel_persistence.py \
            tests/test_migrations.py
          ruff check app tests alembic/versions
          mypy app
          git add -A
      - name: Apply governance closeout
        run: |
          cat builder/.github/m13-03-governance/part* > /tmp/m13-03-governance.patch.gz.b64
          test "$(sha256sum /tmp/m13-03-governance.patch.gz.b64 | cut -d' ' -f1)" = "3e850508a342294040b7f5cc8c78392ae4d8dc9b2b0c43089b9bd1771b088697"
          base64 --decode /tmp/m13-03-governance.patch.gz.b64 | gzip --decompress > /tmp/m13-03-governance.patch
          test "$(sha256sum /tmp/m13-03-governance.patch | cut -d' ' -f1)" = "3b722dcbb744426653035dad71b5ca36ce2576768ca6bfb4372c00dfe4fce45e"
          test "$(wc -c < /tmp/m13-03-governance.patch)" = "32189"
          git -C work apply /tmp/m13-03-governance.patch
          git -C work add -A
          git -C work diff --cached --check
      - name: Verify exact milestone boundary
        working-directory: work
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'CHANGELOG.md',
              'IMPLEMENTATION_TRACKER.md',
              'MODULE_STATUS.md',
              'PROJECT_STATE.md',
              'ROADMAP.md',
              'VALIDATION_RESULTS.md',
              'backend/alembic/versions/0037_persistent_channel_connections.py',
              'backend/app/channels/secrets.py',
              'backend/app/models/__init__.py',
              'backend/app/models/channel_connection.py',
              'backend/app/repositories/channel_connection.py',
              'backend/app/services/audit_service.py',
              'backend/app/services/channel_connection_service.py',
              'backend/tests/test_channel_persistence.py',
              'backend/tests/test_migrations.py',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          assert actual == expected, f'boundary mismatch: {sorted(actual ^ expected)}'
          forbidden = subprocess.check_output([
              'git', 'diff', '--cached', '--name-only', '--',
              'backend/app/api', 'frontend/src', 'frontend/openapi.json',
              'backend/app/identity', 'backend/app/models/contact_identity.py',
              'backend/app/repositories/contact_identity.py',
              'backend/app/services/identity_resolution_service.py',
              'backend/app/channels/meta', 'backend/app/channels/tasks.py'
          ], text=True).strip()
          assert not forbidden, forbidden
          PY
          test "$(git diff --cached --name-only | wc -l)" = "15"
      - name: Create and push single milestone commit
        working-directory: work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(channels): persist channel connections'
          git push origin HEAD:work/m13-03-persistent-channel-connections --force-with-lease
          git fetch origin work/m13-03-persistent-channel-connections
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/work/m13-03-persistent-channel-connections)"
          test "$(git rev-list --count 283ebe83b53a510ce671f150bfe14fe38a5292f6..HEAD)" = "1"
          echo "M13_03_COMMIT=$(git rev-parse HEAD)"
