name: Repair M13-06B Fix Checksums

on:
  pull_request:
    branches:
      - ui/taste-modernization

permissions:
  contents: write

jobs:
  repair-checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/m13-06b-control-plane
          fetch-depth: 0
      - name: Correct verified checksum literals
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/validate-m13-06b-control-plane.yml
          sed -i \
            -e 's/11c5491460c1f2ead2c6db8973a9a2935e9556263c3cf97a3ba58fbf1d81ccbf/11c6253d2026aef197c6792249d92f302a6f2bf57455e02841bb79da2225a685/' \
            -e 's/93f77b0536bf156abef71893c1b8b525536872b8edbd0c84025389d68abfa1d8/527cca9c387db12fc3f5a4e3c9c8fb58141a91d8416aa643efac984354ea4ec8/' \
            "$file"
          grep -q '11c6253d2026aef197c6792249d92f302a6f2bf57455e02841bb79da2225a685' "$file"
          grep -q '527cca9c387db12fc3f5a4e3c9c8fb58141a91d8416aa643efac984354ea4ec8' "$file"
          if git diff --quiet -- "$file"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Commit checksum correction
        if: steps.repair.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Release Engineering'
          git config user.email 'noreply@openai.com'
          git add .github/workflows/validate-m13-06b-control-plane.yml
          git commit -m 'chore(validation): correct m13-06b fix checksums'
          git push origin HEAD:refs/heads/validation/m13-06b-control-plane
