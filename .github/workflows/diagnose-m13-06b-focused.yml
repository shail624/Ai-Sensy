name: Diagnose M13-06B Focused Regression

on:
  pull_request:
    branches:
      - ui/taste-modernization

permissions:
  contents: read

jobs:
  diagnose-focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation package
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Reconstruct package
        shell: bash
        run: |
          set -euo pipefail
          cat .validation/m13-06b/chunk-*.b64 > /tmp/m13-06b-patch.b64
          echo '4f05e0aaa420678d463eb33b873a5ed1aa5562db41b6e7fad37d14505d6bf7d9  /tmp/m13-06b-patch.b64' | sha256sum --check
          base64 --decode /tmp/m13-06b-patch.b64 > /tmp/m13-06b-patch.tar.gz
          echo 'cdb2fac428677d6389e8732310a552e474aac574962c95f005b593b4ff7d89b6  /tmp/m13-06b-patch.tar.gz' | sha256sum --check
          git worktree add --detach /tmp/m13-06b-focused f9a110d34f2095a3e9dbe61a779825edade38bda
          tar -xzf /tmp/m13-06b-patch.tar.gz -C /tmp/m13-06b-focused
      - name: Install backend validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '/tmp/m13-06b-focused/backend[dev]'
      - name: Capture exact focused test output
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          cd /tmp/m13-06b-focused/backend
          python -m pytest -vv tests/test_channel_sync_service.py > /tmp/m13-06b-focused.log 2>&1
      - name: Upload exact traceback
        uses: actions/upload-artifact@v4
        with:
          name: m13-06b-focused-diagnostic
          path: /tmp/m13-06b-focused.log
          if-no-files-found: error
          retention-days: 1
