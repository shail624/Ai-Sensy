name: UI Taste Dashboard Governance

on:
  pull_request:
    branches:
      - work/ui-taste-dashboard

permissions:
  contents: write

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Dashboard work branch
        uses: actions/checkout@v4
        with:
          ref: work/ui-taste-dashboard
          fetch-depth: 0
      - name: Finalize approved milestone wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("ROADMAP.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "| UI-TASTE-02 — Shared design-system modernization — IMPLEMENTED; OWNER APPROVAL PENDING |",
              "| UI-TASTE-02 — Shared design-system modernization — COMPLETE AND OWNER-APPROVED |",
              1,
          )
          text = text.replace(
              "Host visual/reference comparison and owner approval remain pending; no parallel component system or navigation redesign exists.",
              "Host visual/reference comparison remains pending; no parallel component system or navigation redesign exists.",
              1,
          )
          if "UI-TASTE-02 — Shared design-system modernization — COMPLETE AND OWNER-APPROVED" not in text:
              raise RuntimeError("Approved UI-TASTE-02 status was not found")
          if "Host visual/reference comparison and owner approval remain pending" in text:
              raise RuntimeError("Stale owner-approval wording remains")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit governance correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Roadmap wording already synchronized"
            exit 0
          fi
          git commit -m "docs(dashboard): finalize approved milestone wording"
          git push origin HEAD:work/ui-taste-dashboard
