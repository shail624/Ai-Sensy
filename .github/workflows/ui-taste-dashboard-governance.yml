name: UI Taste Dashboard Governance

on:
  pull_request:
    branches:
      - work/ui-taste-dashboard

permissions:
  contents: write

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Dashboard work branch
        uses: actions/checkout@v4
        with:
          ref: work/ui-taste-dashboard
          fetch-depth: 0
      - name: Align approved milestone status
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("ROADMAP.md")
          text = path.read_text(encoding="utf-8")
          old = "| UI-TASTE-02 — Shared design-system modernization — IMPLEMENTED; OWNER APPROVAL PENDING |"
          new = "| UI-TASTE-02 — Shared design-system modernization — COMPLETE AND OWNER-APPROVED |"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise RuntimeError("UI-TASTE-02 roadmap status was not found")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit governance correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Approval status already synchronized"
            exit 0
          fi
          git commit -m "docs(dashboard): align approved UI milestone status"
          git push origin HEAD:work/ui-taste-dashboard
