name: Validate UI-TASTE-04 Final

on:
  pull_request:
    branches:
      - ui/taste-modernization

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Decode isolated milestone package
        run: |
          set -euo pipefail
          rm -rf /tmp/ui-taste-04-package
          mkdir -p /tmp/ui-taste-04-package
          cat .validation/ui-taste-04/package.part-* | base64 --decode > /tmp/ui-taste-04-package.tar.gz
          tar -xzf /tmp/ui-taste-04-package.tar.gz -C /tmp/ui-taste-04-package
          test -x /tmp/ui-taste-04-package/run.sh
      - name: Validate and publish one clean milestone commit
        run: /tmp/ui-taste-04-package/run.sh
