      - name: Commit governance closeout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md MODULE_STATUS.md IMPLEMENTATION_TRACKER.md CHANGELOG.md VALIDATION_RESULTS.md ROADMAP.md
          git diff --cached --check
          git commit -m "docs(ui): record priority 1 validation"
          git push origin HEAD:work/ui-taste-priority-1
