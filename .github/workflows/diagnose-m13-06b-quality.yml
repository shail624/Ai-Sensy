name: Diagnose M13-06B Complete Quality Gate

on:
  pull_request:
    branches:
      - ui/taste-modernization

permissions:
  contents: read

jobs:
  diagnose-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout validation package
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Reconstruct exact product candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .validation/m13-06b/chunk-*.b64 > /tmp/base.b64
          echo '4f05e0aaa420678d463eb33b873a5ed1aa5562db41b6e7fad37d14505d6bf7d9  /tmp/base.b64' | sha256sum --check
          base64 --decode /tmp/base.b64 > /tmp/base.tar.gz
          echo 'cdb2fac428677d6389e8732310a552e474aac574962c95f005b593b4ff7d89b6  /tmp/base.tar.gz' | sha256sum --check
          cat .validation/m13-06b-fix/chunk-*.b64 > /tmp/fix.b64
          echo '11c6253d2026aef197c6792249d92f302a6f2bf57455e02841bb79da2225a685  /tmp/fix.b64' | sha256sum --check
          base64 --decode /tmp/fix.b64 > /tmp/fix.tar.gz
          echo '527cca9c387db12fc3f5a4e3c9c8fb58141a91d8416aa643efac984354ea4ec8  /tmp/fix.tar.gz' | sha256sum --check
          git worktree add --detach /tmp/m13-06b-quality f9a110d34f2095a3e9dbe61a779825edade38bda
          tar -xzf /tmp/base.tar.gz -C /tmp/m13-06b-quality
          tar -xzf /tmp/fix.tar.gz -C /tmp/m13-06b-quality
      - name: Install complete validation toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '/tmp/m13-06b-quality/backend[dev]'
          npm ci --prefix /tmp/m13-06b-quality/frontend
          npm ci --prefix /tmp/m13-06b-quality/e2e
      - name: Capture complete gate output
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          cd /tmp/m13-06b-quality
          python scripts/quality_gate.py pre-merge > /tmp/m13-06b-quality.log 2>&1
      - name: Upload exact gate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m13-06b-quality-diagnostic
          path: /tmp/m13-06b-quality.log
          if-no-files-found: error
          retention-days: 1
