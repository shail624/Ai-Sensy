      - name: Validate documentation contract and change boundary
        shell: bash
        run: |
          git fetch origin ui/taste-modernization --quiet
          git diff --check origin/ui/taste-modernization
          python - <<'PY'
          from pathlib import Path
          import subprocess

          allowed = {
              "CHANGELOG.md",
              "IMPLEMENTATION_TRACKER.md",
              "MODULE_STATUS.md",
              "PROJECT_STATE.md",
              "ROADMAP.md",
              "VALIDATION_RESULTS.md",
              "docs/adr/0020-enterprise-omnichannel-channel-manager.md",
              "docs/design/33-MODULE-13-ENTERPRISE-OMNICHANNEL-IMPLEMENTATION-CONTRACT.md",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", "origin/ui/taste-modernization"], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"unexpected changed files: {unexpected}")
          if changed != allowed:
              raise SystemExit(f"missing expected changed files: {sorted(allowed - changed)}")

          adr = Path("docs/adr/0020-enterprise-omnichannel-channel-manager.md").read_text()
          contract = Path("docs/design/33-MODULE-13-ENTERPRISE-OMNICHANNEL-IMPLEMENTATION-CONTRACT.md").read_text()
          required_contract_headings = [
              "Provider capability matrix",
              "QR provider evaluation and selection gate",
              "Threat model",
              "Security architecture",
              "Session lifecycle contract",
              "Customer identity resolution contract",
              "API contract",
              "Database migration strategy",
              "Rollback strategy",
              "Feature flag strategy",
              "Production rollout plan",
              "Disaster recovery considerations",
              "Monitoring and observability",
              "Performance objectives",
              "Testing strategy",
              "Acceptance criteria",
              "Gap analysis",
              "Known risks",
              "External dependencies",
          ]
          missing = [h for h in required_contract_headings if h not in contract]
          if missing:
              raise SystemExit(f"missing contract headings: {missing}")
          for label in ("Required", "Recommended", "Future Enhancement"):
              if label not in contract:
                  raise SystemExit(f"missing gap classification {label}")
          for invariant in (
              "One existing channel seam",
              "One Contact authority",
              "No automatic cross-provider failover",
              "No implementation without gates",
          ):
              if invariant not in adr:
                  raise SystemExit(f"missing ADR invariant: {invariant}")
          for path in (
              "PROJECT_STATE.md",
              "MODULE_STATUS.md",
              "IMPLEMENTATION_TRACKER.md",
              "ROADMAP.md",
              "VALIDATION_RESULTS.md",
              "CHANGELOG.md",
          ):
