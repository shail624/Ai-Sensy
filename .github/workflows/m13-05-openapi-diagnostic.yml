name: M13-05 OpenAPI diagnostic

on:
  pull_request:
    branches:
      - validation/m13-05-focused-base

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve M13-05 overlays
        run: |
          cat .validation/m13-05-overlay/part* > /tmp/m13-05-overlay.b64
          cp .validation/m13-05-fix.b64 /tmp/m13-05-fix.b64

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install baseline backend dependencies
        run: |
          git checkout --force 5d7ea154588418410611de4f568e978c2e3caba9
          python -m pip install -e './backend[dev]'
          python - <<'PY'
          import fastapi, pydantic
          print('FastAPI:', fastapi.__version__)
          print('Pydantic:', pydantic.__version__)
          PY

      - name: Prove canonical serialization matches committed contract
        run: |
          cp frontend/openapi.json /tmp/openapi.committed.json
          (cd backend && python - <<'PY'
          import json
          from pathlib import Path
          from app.main import create_app
          target = Path('../frontend/openapi.canonical.json')
          target.write_text(
              json.dumps(create_app().openapi(), indent=2, ensure_ascii=False, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          )
          cmp frontend/openapi.json frontend/openapi.canonical.json
          sha256sum frontend/openapi.json frontend/openapi.canonical.json
          rm frontend/openapi.canonical.json
          echo 'Canonical sort_keys serialization exactly matches committed OpenAPI.'

      - name: Compare baseline and M13-05 generation
        run: |
          (cd backend && python scripts/export_openapi.py)
          cp frontend/openapi.json /tmp/openapi.baseline.generated.json
          git checkout --force 5d7ea154588418410611de4f568e978c2e3caba9
          base64 --decode /tmp/m13-05-overlay.b64 > /tmp/m13-05-overlay.tar.gz
          tar -xzf /tmp/m13-05-overlay.tar.gz
          base64 --decode /tmp/m13-05-fix.b64 > /tmp/m13-05-fix.tar.gz
          tar -xzf /tmp/m13-05-fix.tar.gz
          (cd backend && python scripts/export_openapi.py)
          cmp /tmp/openapi.baseline.generated.json frontend/openapi.json
          python - <<'PY'
          import json
          from pathlib import Path
          committed = json.loads(Path('/tmp/openapi.committed.json').read_text())
          generated = json.loads(Path('frontend/openapi.json').read_text())
          assert committed == generated
          print('Semantically identical paths:', len(generated['paths']))
          PY
