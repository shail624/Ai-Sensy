name: M13-05 OpenAPI diagnostic

on:
  pull_request:
    branches:
      - validation/m13-05-focused-base

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve overlays
        run: |
          cat .validation/m13-05-overlay/part* > /tmp/m13-05-overlay.b64
          cp .validation/m13-05-fix.b64 /tmp/m13-05-fix.b64

      - name: Restore exact product tree
        run: |
          git checkout --force 5d7ea154588418410611de4f568e978c2e3caba9
          base64 --decode /tmp/m13-05-overlay.b64 > /tmp/m13-05-overlay.tar.gz
          tar -xzf /tmp/m13-05-overlay.tar.gz
          base64 --decode /tmp/m13-05-fix.b64 > /tmp/m13-05-fix.tar.gz
          tar -xzf /tmp/m13-05-fix.tar.gz
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/services/pairing_manager.py')
          text = path.read_text()
          wrong = '    PairingState,\n    RuntimeMetadata,\n    RuntimeEvent,\n    RuntimeEventType,\n'
          correct = '    PairingState,\n    RuntimeEvent,\n    RuntimeEventType,\n    RuntimeMetadata,\n'
          if wrong in text:
              path.write_text(text.replace(wrong, correct, 1))
          elif correct not in text:
              raise SystemExit('pairing import block not found')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e './backend[dev]'

      - name: Show exact OpenAPI drift
        run: |
          cp frontend/openapi.json /tmp/openapi.committed.json
          (cd backend && python scripts/export_openapi.py)
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('/tmp/openapi.committed.json').read_text())
          after = json.loads(Path('frontend/openapi.json').read_text())
          print('before paths:', len(before['paths']))
          print('after paths:', len(after['paths']))
          print('before version:', before.get('openapi'))
          print('after version:', after.get('openapi'))
          PY
          git diff --no-ext-diff --unified=5 -- frontend/openapi.json
