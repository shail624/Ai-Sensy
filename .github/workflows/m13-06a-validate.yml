name: Validate M13-06A Sync Media Foundation

on:
  push:
    branches:
      - validation/m13-05-implementation-runner

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Reconstruct and run isolated validation
        run: |
          cat .validation/m13-06a/payload.part* | base64 --decode > /tmp/m13-06a-payload.tar.gz
          mkdir -p /tmp/m13-06a-payload
          tar -xzf /tmp/m13-06a-payload.tar.gz -C /tmp/m13-06a-payload
          chmod +x /tmp/m13-06a-payload/run_m13_06a.sh
          /tmp/m13-06a-payload/run_m13_06a.sh
