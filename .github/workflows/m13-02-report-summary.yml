name: M13-02 Gate Report Summary

on:
  pull_request:
    branches:
      - validation/m13-02-report-summary

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout report branch
        uses: actions/checkout@v4
        with:
          ref: validation/m13-02-gate-output
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: false

      - name: Build concise report
        shell: bash
        run: |
          failure="$(grep '^FIRST_FAILURE=' M13_02_GATE_DIAGNOSTIC.txt | tail -n 1 | cut -d= -f2-)"
          stage="$(mktemp)"
          if [ -n "$failure" ]; then
            sed -n "/^=== ${failure} ===$/,/^EXIT=/p" M13_02_GATE_DIAGNOSTIC.txt > "$stage"
          else
            tail -n 300 M13_02_GATE_DIAGNOSTIC.txt > "$stage"
          fi
          {
            echo '=== STATUS ==='
            grep -E '^(FIRST_FAILURE|ALL_DIAGNOSTIC_GATES_PASS|BASELINE|RUN)=' M13_02_GATE_DIAGNOSTIC.txt || true
            echo
            echo '=== STAGE RESULTS ==='
            grep -E '^=== |^EXIT=' M13_02_GATE_DIAGNOSTIC.txt || true
            echo
            echo '=== ROOT CAUSE LINES ==='
            grep -E '(^FAILED |^ERROR |^E   |short test summary|failed,|passed,|AssertionError|IntegrityError|OperationalError|InvalidRequestError|TypeError|ValueError|KeyError|AttributeError|ConflictError|NotFoundError|VersionConflictError|sqlalchemy\.exc|pydantic_core|fastapi\.exceptions)' "$stage" || true
            echo
            echo '=== FAILURE TAIL ==='
            tail -n 180 "$stage"
          } > M13_02_GATE_SUMMARY.txt

      - name: Commit concise report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add M13_02_GATE_SUMMARY.txt
          git commit -m 'ci(validation): summarize M13-02 gate report'
          git push origin HEAD:validation/m13-02-gate-output