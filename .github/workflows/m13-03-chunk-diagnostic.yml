name: M13-03 patch chunk diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation authority
        uses: actions/checkout@v4
        with:
          ref: validation/m13-03-builder
      - name: Capture chunks
        run: |
          sha256sum .github/m13-03-patch/part*
          wc -c .github/m13-03-patch/part*
          cat .github/m13-03-patch/part* > m13-03.patch.gz.b64
          cp .github/m13-03-patch/part03 part03.actual
          sha256sum m13-03.patch.gz.b64 part03.actual
          wc -c m13-03.patch.gz.b64 part03.actual
      - name: Upload chunks
        uses: actions/upload-artifact@v4
        with:
          name: m13-03-chunk-payload
          path: |
            m13-03.patch.gz.b64
            part03.actual
          if-no-files-found: error
          retention-days: 1
