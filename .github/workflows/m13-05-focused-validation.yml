name: M13-05 full validation

on:
  pull_request:
    branches:
      - validation/m13-05-focused-base

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout validation merge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve overlays
        run: |
          cat .validation/m13-05-overlay/part* > /tmp/m13-05-overlay.b64
          cp .validation/m13-05-fix.b64 /tmp/m13-05-fix.b64

      - name: Restore approved baseline and overlays
        run: |
          git checkout --force 5d7ea154588418410611de4f568e978c2e3caba9
          base64 --decode /tmp/m13-05-overlay.b64 > /tmp/m13-05-overlay.tar.gz
          tar -xzf /tmp/m13-05-overlay.tar.gz
          base64 --decode /tmp/m13-05-fix.b64 > /tmp/m13-05-fix.tar.gz
          tar -xzf /tmp/m13-05-fix.tar.gz
          python - <<'PY'
          from pathlib import Path

          pairing = Path('backend/app/services/pairing_manager.py')
          text = pairing.read_text()
          wrong_imports = (
              '    PairingState,\n'
              '    RuntimeMetadata,\n'
              '    RuntimeEvent,\n'
              '    RuntimeEventType,\n'
          )
          correct_imports = (
              '    PairingState,\n'
              '    RuntimeEvent,\n'
              '    RuntimeEventType,\n'
              '    RuntimeMetadata,\n'
          )
          if wrong_imports in text:
              text = text.replace(wrong_imports, correct_imports, 1)
          elif correct_imports not in text:
              raise SystemExit('pairing import block not found')

          old_method = '''    async def expire_due_pairings(\n        self,\n        *,\n        organization_id: int,\n        actor: User,\n        at: datetime | None = None,\n    ) -> list[ChannelSession]:\n        """Expire due pairing availability without requiring a now-dead runtime lease."""\n\n        await self._require_authenticate(organization_id, actor)\n        now = at or utcnow()\n        rows = await self._sessions.list_due_pairings(organization_id, now)\n'''
          new_method = '''    async def expire_due_pairings(\n        self,\n        *,\n        organization_id: int,\n        actor: User,\n        at: datetime | None = None,\n        limit: int = 100,\n    ) -> list[ChannelSession]:\n        """Expire due pairing availability without requiring a now-dead runtime lease."""\n\n        await self._require_authenticate(organization_id, actor)\n        if limit < 1 or limit > 1000:\n            raise ValidationError("limit must be between 1 and 1000.")\n        now = at or utcnow()\n        rows = await self._sessions.list_due_pairings(organization_id, now, limit=limit)\n'''
          if old_method in text:
              text = text.replace(old_method, new_method, 1)
          elif new_method not in text:
              raise SystemExit('expire_due_pairings block not found')
          pairing.write_text(text)

          repository = Path('backend/app/repositories/channel_session.py')
          text = repository.read_text()
          old_repo = '''    async def list_due_pairings(\n        self, organization_id: int, at: datetime\n    ) -> list[ChannelSession]:\n'''
          new_repo = '''    async def list_due_pairings(\n        self, organization_id: int, at: datetime, *, limit: int = 100\n    ) -> list[ChannelSession]:\n'''
          if old_repo in text:
              text = text.replace(old_repo, new_repo, 1)
          elif new_repo not in text:
              raise SystemExit('list_due_pairings signature not found')
          old_order = '''            .order_by(ChannelSession.pairing_expires_at.asc(), ChannelSession.id.asc())\n            .with_for_update()\n'''
          new_order = '''            .order_by(ChannelSession.pairing_expires_at.asc(), ChannelSession.id.asc())\n            .limit(limit)\n            .with_for_update()\n'''
          if old_order in text:
              text = text.replace(old_order, new_order, 1)
          elif new_order not in text:
              raise SystemExit('list_due_pairings query not found')
          repository.write_text(text)

          tests = Path('backend/tests/test_provider_runtime.py')
          text = tests.read_text()
          invalid_limit = '''    with pytest.raises(ValidationError, match="limit"):\n        await pairing.expire_due_pairings(\n            organization_id=organization.id,\n            actor=actor,\n            at=now + timedelta(seconds=21),\n            limit=0,\n        )\n\n'''
          anchor = '''    expired = await pairing.expire_due_pairings(\n        organization_id=organization.id,\n        actor=actor,\n        at=now + timedelta(seconds=21),\n    )\n'''
          if invalid_limit not in text:
              if anchor not in text:
                  raise SystemExit('pairing expiry test anchor not found')
              text = text.replace(anchor, invalid_limit + anchor, 1)
          tests.write_text(text)
          PY

      - name: Verify exact implementation boundary
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'backend/alembic/versions/0039_qr_pairing_provider_runtime_foundation.py',
              'backend/app/channels/capabilities.py',
              'backend/app/channels/dependencies.py',
              'backend/app/channels/flags.py',
              'backend/app/channels/runtime.py',
              'backend/app/channels/runtime_registry.py',
              'backend/app/models/channel_session.py',
              'backend/app/rbac/catalog.py',
              'backend/app/repositories/channel_session.py',
              'backend/app/services/audit_service.py',
              'backend/app/services/pairing_manager.py',
              'backend/app/services/provider_runtime_manager.py',
              'backend/app/services/session_manager.py',
              'backend/tests/test_channel_foundation.py',
              'backend/tests/test_migrations.py',
              'backend/tests/test_provider_runtime.py',
          }
          modified = set(subprocess.check_output(
              ['git', 'diff', '--name-only', '5d7ea154588418410611de4f568e978c2e3caba9']
          ).decode().splitlines())
          untracked = set(subprocess.check_output(
              ['git', 'ls-files', '--others', '--exclude-standard']
          ).decode().splitlines())
          actual = modified | untracked
          assert actual == expected, f'unexpected boundary: {sorted(actual ^ expected)}'
          assert not any(path.startswith('frontend/') for path in actual)
          assert not any(path.startswith('backend/app/api/') for path in actual)
          print('Implementation files:', len(actual))
          PY
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend
        run: python -m pip install -e './backend[dev]'

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install browser tests
        working-directory: e2e
        run: npm ci

      - name: Run repository pre-merge quality gate
        env:
          WA_QUALITY_PYTHON: python
          WA_QUALITY_NPM: npm
          WA_QUALITY_DOCKER: docker
        run: python scripts/quality_gate.py pre-merge

      - name: Verify migration and OpenAPI evidence
        working-directory: backend
        run: |
          pytest -q tests/test_migrations.py tests/test_provider_runtime.py
          python - <<'PY'
          import json
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from app.main import create_app
          cfg = Config('alembic.ini')
          script = ScriptDirectory.from_config(cfg)
          assert script.get_current_head() == '0039_qr_pairing_provider_runtime_foundation'
          document = create_app().openapi()
          assert len(document['paths']) == 200
          text = json.dumps(document)
          for forbidden in (
              'pairing_state', 'pairing_reason_code', 'runtime_capabilities_json',
              'qr_payload', 'channel_sessions'
          ):
              assert forbidden not in text
          print('Migration head:', script.get_current_head())
          print('OpenAPI paths:', len(document['paths']))
          PY

      - name: Record bundle evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip
          for path in sorted(Path('frontend/dist/assets').glob('*')):
              if path.is_file():
                  raw = path.stat().st_size
                  gz = len(gzip.compress(path.read_bytes()))
                  if path.suffix in {'.js', '.css'}:
                      print(f'{path.name}: {raw / 1000:.2f} kB / {gz / 1000:.2f} kB gzip')
          PY
