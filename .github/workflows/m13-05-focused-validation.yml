name: M13-05 full validation

on:
  pull_request:
    branches:
      - validation/m13-05-focused-base

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout validation merge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve overlays
        run: |
          cat .validation/m13-05-overlay/part* > /tmp/m13-05-overlay.b64
          cp .validation/m13-05-fix.b64 /tmp/m13-05-fix.b64

      - name: Restore approved baseline and overlays
        run: |
          git checkout --force 5d7ea154588418410611de4f568e978c2e3caba9
          base64 --decode /tmp/m13-05-overlay.b64 > /tmp/m13-05-overlay.tar.gz
          tar -xzf /tmp/m13-05-overlay.tar.gz
          base64 --decode /tmp/m13-05-fix.b64 > /tmp/m13-05-fix.tar.gz
          tar -xzf /tmp/m13-05-fix.tar.gz
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/services/pairing_manager.py')
          text = path.read_text()
          wrong = (
              '    PairingState,\n'
              '    RuntimeMetadata,\n'
              '    RuntimeEvent,\n'
              '    RuntimeEventType,\n'
          )
          correct = (
              '    PairingState,\n'
              '    RuntimeEvent,\n'
              '    RuntimeEventType,\n'
              '    RuntimeMetadata,\n'
          )
          if wrong not in text:
              raise SystemExit('expected transferred pairing import order not found')
          path.write_text(text.replace(wrong, correct, 1))
          PY

      - name: Verify exact implementation boundary
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'backend/alembic/versions/0039_qr_pairing_provider_runtime_foundation.py',
              'backend/app/channels/capabilities.py',
              'backend/app/channels/dependencies.py',
              'backend/app/channels/flags.py',
              'backend/app/channels/runtime.py',
              'backend/app/channels/runtime_registry.py',
              'backend/app/models/channel_session.py',
              'backend/app/rbac/catalog.py',
              'backend/app/repositories/channel_session.py',
              'backend/app/services/audit_service.py',
              'backend/app/services/pairing_manager.py',
              'backend/app/services/provider_runtime_manager.py',
              'backend/app/services/session_manager.py',
              'backend/tests/test_channel_foundation.py',
              'backend/tests/test_migrations.py',
              'backend/tests/test_provider_runtime.py',
          }
          modified = set(subprocess.check_output(
              ['git', 'diff', '--name-only', '5d7ea154588418410611de4f568e978c2e3caba9']
          ).decode().splitlines())
          untracked = set(subprocess.check_output(
              ['git', 'ls-files', '--others', '--exclude-standard']
          ).decode().splitlines())
          actual = modified | untracked
          assert actual == expected, f'unexpected boundary: {sorted(actual ^ expected)}'
          assert not any(path.startswith('frontend/') for path in actual)
          assert not any(path.startswith('backend/app/api/') for path in actual)
          print('Implementation files:', len(actual))
          PY
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend
        run: python -m pip install -e './backend[dev]'

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install browser tests
        working-directory: e2e
        run: npm ci

      - name: Run repository pre-merge quality gate
        env:
          WA_QUALITY_PYTHON: python
          WA_QUALITY_NPM: npm
          WA_QUALITY_DOCKER: docker
        run: python scripts/quality_gate.py pre-merge

      - name: Verify migration and OpenAPI evidence
        working-directory: backend
        run: |
          pytest -q tests/test_migrations.py tests/test_provider_runtime.py
          python - <<'PY'
          import json
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from app.main import create_app
          cfg = Config('alembic.ini')
          script = ScriptDirectory.from_config(cfg)
          assert script.get_current_head() == '0039_qr_pairing_provider_runtime_foundation'
          document = create_app().openapi()
          assert len(document['paths']) == 200
          text = json.dumps(document)
          for forbidden in (
              'pairing_state', 'pairing_reason_code', 'runtime_capabilities_json',
              'qr_payload', 'channel_sessions'
          ):
              assert forbidden not in text
          print('Migration head:', script.get_current_head())
          print('OpenAPI paths:', len(document['paths']))
          PY

      - name: Record bundle evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip
          for path in sorted(Path('frontend/dist/assets').glob('*')):
              if path.is_file():
                  raw = path.stat().st_size
                  gz = len(gzip.compress(path.read_bytes()))
                  if path.suffix in {'.js', '.css'}:
                      print(f'{path.name}: {raw / 1000:.2f} kB / {gz / 1000:.2f} kB gzip')
          PY
