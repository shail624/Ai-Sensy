name: M13-05 focused validation

on:
  pull_request:
    branches:
      - validation/m13-05-focused-base

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validation merge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve overlays
        run: |
          cat .validation/m13-05-overlay/part* > /tmp/m13-05-overlay.b64
          cp .validation/m13-05-fix.b64 /tmp/m13-05-fix.b64
          cp .validation/m13-05-import-fix.b64 /tmp/m13-05-import-fix.b64

      - name: Restore approved baseline and overlays
        run: |
          git checkout --force 5d7ea154588418410611de4f568e978c2e3caba9
          base64 --decode /tmp/m13-05-overlay.b64 > /tmp/m13-05-overlay.tar.gz
          tar -xzf /tmp/m13-05-overlay.tar.gz
          base64 --decode /tmp/m13-05-fix.b64 > /tmp/m13-05-fix.tar.gz
          tar -xzf /tmp/m13-05-fix.tar.gz
          base64 --decode /tmp/m13-05-import-fix.b64 > /tmp/m13-05-import-fix.tar.gz
          tar -xzf /tmp/m13-05-import-fix.tar.gz
          git status --short

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e './backend[dev]'

      - name: Ruff
        working-directory: backend
        run: ruff check app tests

      - name: Strict mypy
        working-directory: backend
        run: mypy app

      - name: Focused tests
        working-directory: backend
        run: pytest -q tests/test_channel_foundation.py tests/test_session_manager.py tests/test_provider_runtime.py tests/test_migrations.py

      - name: OpenAPI invariance
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          from app.main import create_app
          document = create_app().openapi()
          assert len(document['paths']) == 200
          text = json.dumps(document)
          for forbidden in ('pairing_state', 'pairing_reason_code', 'runtime_capabilities_json', 'qr_payload', 'channel_sessions'):
              assert forbidden not in text
          print('OpenAPI paths:', len(document['paths']))
          PY
