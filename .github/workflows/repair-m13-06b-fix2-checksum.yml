name: Repair M13-06B Fix2 Checksum

on:
  pull_request:
    branches:
      - ui/taste-modernization

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'validation/m13-06b-control-plane'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: validation/m13-06b-control-plane
          fetch-depth: 0

      - name: Repair independently encoded chunk reconstruction
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .validation/m13-06b-fix2 -maxdepth 1 -name 'chunk-*.b64' | wc -l)" -eq 2
          : > /tmp/fix2.tar.gz
          for file in .validation/m13-06b-fix2/chunk-*.b64; do
            base64 --decode "$file" >> /tmp/fix2.tar.gz
          done
          TAR_SHA="$(sha256sum /tmp/fix2.tar.gz | awk '{print $1}')"
          tar -tzf /tmp/fix2.tar.gz >/dev/null
          FILE=.github/workflows/validate-m13-06b-control-plane-v2.yml
          python - "$FILE" "$TAR_SHA" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          tar_sha = sys.argv[2]
          text = path.read_text()
          old = """          test \"$(find .validation/m13-06b-fix2 -maxdepth 1 -name 'chunk-*.b64' | wc -l)\" -eq 2
          cat .validation/m13-06b-fix2/chunk-*.b64 > /tmp/fix2.b64
          echo '3d5d8b737ee37bf37bdc6f79271cf57d34262bb7226f4fbeb69f9d720e4c74c9  /tmp/fix2.b64' | sha256sum --check
          base64 --decode /tmp/fix2.b64 > /tmp/fix2.tar.gz
          echo '6363fea457a2cac58cb819469f8dd7905440f14c852980e5dbba07aa8eec004d  /tmp/fix2.tar.gz' | sha256sum --check
"""
          new = f"""          test \"$(find .validation/m13-06b-fix2 -maxdepth 1 -name 'chunk-*.b64' | wc -l)\" -eq 2
          : > /tmp/fix2.tar.gz
          for file in .validation/m13-06b-fix2/chunk-*.b64; do
            base64 --decode \"$file\" >> /tmp/fix2.tar.gz
          done
          echo '{tar_sha}  /tmp/fix2.tar.gz' | sha256sum --check
"""
          if old not in text:
              raise SystemExit('expected reconstruction block not found')
          path.write_text(text.replace(old, new))
          PY
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Commit verified reconstruction repair
        if: steps.repair.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Release Engineering'
          git config user.email 'noreply@openai.com'
          git add .github/workflows/validate-m13-06b-control-plane-v2.yml
          git commit -m 'chore(validation): reconstruct m13-06b fix2 chunks'
          git push origin HEAD:refs/heads/validation/m13-06b-control-plane
