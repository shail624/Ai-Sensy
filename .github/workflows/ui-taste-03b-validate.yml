name: Validate UI-TASTE-03B Reactivation Hierarchy

on:
  pull_request:
    branches:
      - validation/ui-taste-03b-base

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Run isolated validation
        run: |
          mkdir -p /tmp/ui-taste-03b
          cat .validation/ui-taste-03b/payload.b64 .validation/ui-taste-03b/payload.part* | base64 --decode > /tmp/ui-taste-03b-payload.tar.gz
          tar -xzf /tmp/ui-taste-03b-payload.tar.gz -C /tmp/ui-taste-03b
          python .validation/ui-taste-03b/fix.py /tmp/ui-taste-03b
          python .validation/ui-taste-03b/fix_runner.py /tmp/ui-taste-03b
          chmod +x /tmp/ui-taste-03b/run_ui_taste_03b.sh
          /tmp/ui-taste-03b/run_ui_taste_03b.sh
